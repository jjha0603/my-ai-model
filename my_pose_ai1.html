<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Pose AI</title>
    <style>
        /* 기본 블랙 테마 & 폰트 크기 업그레이드 */
        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 전체를 감싸는 컨테이너 */
        .container {
            background-color: #16161a;
            border: 2px solid #00ff66; /* 멋진 네온 그린 테두리 */
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
            max-width: 550px;
            width: 100%;
        }

        /* 메인 타이틀 (더 크고 굵게) */
        h1 {
            font-size: 2.3rem;
            color: #00ff66;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        /* 캔버스 가두기 (둥근 모서리) */
        .canvas-wrapper {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #222;
            display: inline-block;
            background-color: #000;
        }

        /* 시작 버튼 스타일 */
        .btn-start {
            background-color: #00ff66;
            color: #000000;
            font-size: 1.4rem; /* 큰 글씨 */
            font-weight: bold;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3);
        }

        .btn-start:hover {
            background-color: #000000;
            color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            border: 2px solid #00ff66;
            padding: 13px 38px; /* 보더 두께만큼 패딩 조절 */
        }

        /* 인식 결과 레이블 (글씨 크게) */
        #label-container {
            margin-top: 20px;
            background-color: #1f1f24;
            border-radius: 10px;
            padding: 15px;
        }

        #label-container div {
            font-size: 1.6rem; /* 기존보다 훨씬 키운 텍스트 크기 */
            font-weight: bold;
            margin: 10px 0;
            color: #e0e0e0;
        }

        /* 💡 포즈 도움말 가이드 영역 */
        .pose-guide {
            margin-top: 25px;
            padding: 20px;
            background-color: #0c0c0e;
            border-left: 5px solid #00ff66;
            border-radius: 0 12px 12px 0;
            text-align: left;
        }

        .pose-guide h3 {
            font-size: 1.3rem;
            color: #00ff66;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pose-guide p {
            font-size: 1.1rem;
            color: #a0a0a5;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Teachable Machine Pose Model</h1>
        
        <button type="button" class="btn-start" onclick="init()">AI 카메라 시작</button>
        
        <div class="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>
        
        <div id="label-container"></div>
        
        <div class="pose-guide">
            <h3>💡 올바른 측정 도움말</h3>
            <p>
                1. 카메라가 상반신 또는 전신이 다 나오도록 각도를 조절해 주세요.<br>
                2. 관절(어깨, 팔꿈치, 골반 등)이 초록색 선으로 잘 연결되는지 확인합니다.<br>
                3. 너무 어두운 곳에서는 인식률이 떨어질 수 있으니 밝은 곳에서 진행해 주세요!
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/LjIYL5d6Z/";
        let model, webcam, ctx, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const size = 300;
            const flip = true; 
            webcam = new tmPose.Webcam(size, size, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            const canvas = document.getElementById("canvas");
            canvas.width = size; canvas.height = size;
            ctx = canvas.getContext("2d");
            labelContainer = document.getElementById("label-container");
            
            // 기존 컨테이너 비우기 (중복 방지)
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) { 
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop(timestamp) {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            for (let i = 0; i < maxPredictions; i++) {
                // 가독성을 위해 소수점을 % 단위로 보기 편하게 세팅하실 수도 있습니다. 
                // 여기서는 기존 데이터 형식을 유지하면서 글씨 크기만 크게 반영했습니다.
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }

            drawPose(pose);
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
